
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 자산 관리</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 24px;
  font-family: Arial, sans-serif;
  background: #f5f6f8; color: #222;
}
.container { max-width: 1000px; margin: auto; }
h1 { margin-bottom: 8px; }
.sub { color: #777; margin-bottom: 28px; }
.dashboard {
  display: grid; grid-template-columns: repeat(3,1fr);
  gap: 12px; margin-bottom: 24px;
}
.card, .panel {
  background: white; border-radius: 12px;
  padding: 20px; border: 1px solid #eee;
}
.card small { color: #777; }
.amount { font-size: 24px; font-weight: bold; margin-top: 10px; }
.panel { margin-bottom: 20px; }
.panel h2 { font-size: 18px; margin-top: 0; }
form {
  display: grid; grid-template-columns: repeat(2,1fr);
  gap: 12px;
}
.field { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 13px; color: #666; }
input, select {
  width: 100%; padding: 11px;
  border: 1px solid #ddd; border-radius: 7px;
  font-size: 14px; background: white;
}
button {
  padding: 11px 16px; border: 0; border-radius: 7px;
  cursor: pointer; background: #222; color: white;
  font-size: 14px;
}
button.secondary { background: #eee; color: #333; }
button.delete { background: #fff0f0; color: #c33; }
.full { grid-column: 1 / -1; }
.result {
  background: #f5f7fa; padding: 14px;
  border-radius: 8px; line-height: 1.9;
  grid-column: 1 / -1; font-size: 14px;
}
table { width: 100%; border-collapse: collapse; }
th, td {
  text-align: left; padding: 12px 8px;
  border-bottom: 1px solid #eee; font-size: 14px;
}
th { color: #777; font-weight: normal; }
.actions { display: flex; gap: 6px; }
.actions button { padding: 7px 10px; font-size: 12px; }
.hidden { display: none !important; }
@media(max-width:650px) {
  body { padding: 14px; }
  .dashboard { grid-template-columns: 1fr; }
  form { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
  .table-wrap { overflow-x: auto; }
}
</style>
</head>
<body>
<div class="container">
  <h1>나의 자산 관리</h1>
  <p class="sub">자산 현황과 적금 예상 금액을 관리해 보세요.</p>

  <section class="dashboard">
    <div class="card">
      <small>총자산</small>
      <div class="amount" id="totalAssets">0원</div>
    </div>
    <div class="card">
      <small>총부채</small>
      <div class="amount" id="totalDebt">0원</div>
    </div>
    <div class="card">
      <small>순자산</small>
      <div class="amount" id="netAssets">0원</div>
    </div>
  </section>

  <section class="panel">
    <h2>자산 등록</h2>
    <form id="assetForm">
      <div class="field">
        <label for="assetName">자산명</label>
        <input id="assetName" placeholder="예: 청년도약계좌" required>
      </div>
      <div class="field">
        <label for="assetType">자산 유형</label>
        <select id="assetType">
          <option value="현금">현금</option>
          <option value="예적금">예적금</option>
          <option value="투자">투자</option>
          <option value="연금">연금</option>
          <option value="주택청약">주택청약</option>
          <option value="기타">기타</option>
          <option value="부채">부채</option>
        </select>
      </div>

      <div class="field">
        <label for="assetAmount">현재 금액 (원)</label>
        <input id="assetAmount" type="number" min="0"
          placeholder="예: 9500000" required>
      </div>

      <div class="field">
        <label for="assetMemo">메모 (선택)</label>
        <input id="assetMemo" placeholder="간단한 메모">
      </div>

      <div class="full">
        <button type="submit" id="saveAssetButton">자산 등록</button>
        <button type="button" class="secondary hidden"
          id="cancelEditButton">수정 취소</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>적금 자동 계산</h2>
    <form id="savingForm">
      <div class="field">
        <label for="savingName">적금 상품명</label>
        <input id="savingName" placeholder="예: 정기적금" required>
      </div>
      <div class="field">
        <label for="savingStart">적금 시작일</label>
        <input id="savingStart" type="date" required>
      </div>
      <div class="field">
        <label for="monthlyPayment">월 납입액 (원)</label>
        <input id="monthlyPayment" type="number" min="1"
          placeholder="500000" required>
      </div>
      <div class="field">
        <label for="savingMonths">적금 기간 (개월)</label>
        <input id="savingMonths" type="number" min="1"
          placeholder="36" required>
      </div>
      <div class="field">
        <label for="annualRate">연이율 (%)</label>
        <input id="annualRate" type="number" min="0" step="0.01"
          placeholder="5" required>
      </div>
      <div class="field">
        <label for="taxRate">이자 과세율 (%)</label>
        <input id="taxRate" type="number" min="0" max="100"
          step="0.01" value="15.4" required>
      </div>

      <div class="result full" id="savingResult">
        적금 조건을 입력하면 예상 금액이 자동으로 계산됩니다.
      </div>
      <div class="full">
        <button type="submit">적금 등록</button>
      </div>
    </form>
  </section>

  <section class="panel">
    <h2>등록된 자산</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>자산명</th><th>유형</th>
            <th>현재 금액</th><th>관리</th>
          </tr>
        </thead>
        <tbody id="assetList"></tbody>
      </table>
    </div>
    <p id="emptyMessage" style="color:#888;text-align:center">
      등록된 자산이 없습니다.
    </p>
  </section>
</div>

<script>
const STORAGE_KEY = "myAssetManagerData";

let assets = [];
let editingId = null;

const $ = id => document.getElementById(id);
const won = value => Math.round(value).toLocaleString("ko-KR") + "원";

function loadAssets() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    assets = saved ? JSON.parse(saved) : [];
    if (!Array.isArray(assets)) assets = [];
  } catch (error) {
    assets = [];
    alert("저장된 자산 데이터를 읽지 못했습니다.");
  }
}

function saveAssets() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(assets));
    return true;
  } catch (error) {
    alert("저장에 실패했습니다. 브라우저 저장 공간을 확인해 주세요.");
    return false;
  }
}

function render() {
  const tbody = $("assetList");
  tbody.innerHTML = "";

  let totalAssets = 0;
  let totalDebt = 0;

  assets.forEach(asset => {
    const amount = Number(asset.amount) || 0;

    if (asset.type === "부채") totalDebt += amount;
    else totalAssets += amount;

    const tr = document.createElement("tr");

    [asset.name, asset.type, won(amount)].forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const actionCell = document.createElement("td");
    const actions = document.createElement("div");
    actions.className = "actions";

    const editButton = document.createElement("button");
    editButton.type = "button";
    editButton.className = "secondary";
    editButton.textContent = "수정";
    editButton.addEventListener("click", () => editAsset(asset.id));

    const deleteButton = document.createElement("button");
    deleteButton.type = "button";
    deleteButton.className = "delete";
    deleteButton.textContent = "삭제";
    deleteButton.addEventListener("click", () => deleteAsset(asset.id));

    actions.append(editButton, deleteButton);
    actionCell.appendChild(actions);
    tr.appendChild(actionCell);
    tbody.appendChild(tr);
  });

  $("totalAssets").textContent = won(totalAssets);
  $("totalDebt").textContent = won(totalDebt);
  $("netAssets").textContent = won(totalAssets - totalDebt);
  $("emptyMessage").classList.toggle("hidden", assets.length > 0);
}

$("assetForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = $("assetName").value.trim();
  const type = $("assetType").value;
  const amount = Number($("assetAmount").value);
  const memo = $("assetMemo").value.trim();

  if (!name || !Number.isFinite(amount) || amount < 0) {
    alert("자산명과 올바른 금액을 입력해 주세요.");
    return;
  }

  if (editingId !== null) {
    const index = assets.findIndex(item => item.id === editingId);
    if (index !== -1) {
      assets[index] = { ...assets[index], name, type, amount, memo };
    }
  } else {
    assets.push({
      id: Date.now().toString() + Math.random().toString(16).slice(2),
      name, type, amount, memo
    });
  }

  if (!saveAssets()) return;

  resetAssetForm();
  render();
});

function editAsset(id) {
  const asset = assets.find(item => item.id === id);
  if (!asset) return;

  editingId = id;
  $("assetName").value = asset.name;
  $("assetType").value = asset.type;
  $("assetAmount").value = asset.amount;
  $("assetMemo").value = asset.memo || "";
  $("saveAssetButton").textContent = "수정 내용 저장";
  $("cancelEditButton").classList.remove("hidden");
  $("assetForm").scrollIntoView({ behavior: "smooth" });
}

function resetAssetForm() {
  editingId = null;
  $("assetForm").reset();
  $("saveAssetButton").textContent = "자산 등록";
  $("cancelEditButton").classList.add("hidden");
}

$("cancelEditButton").addEventListener("click", resetAssetForm);

function deleteAsset(id) {
  if (!confirm("이 자산을 삭제할까요?")) return;
  assets = assets.filter(item => item.id !== id);
  if (saveAssets()) render();
}

// 날짜별 납입 횟수와 예상 이자 계산
function addMonths(date, months) {
  const result = new Date(date);
  const originalDay = result.getDate();
  result.setDate(1);
  result.setMonth(result.getMonth() + months);
  const lastDay = new Date(
    result.getFullYear(), result.getMonth() + 1, 0
  ).getDate();
  result.setDate(Math.min(originalDay, lastDay));
  return result;
}

function calculateSaving(start, monthly, months, rate, tax) {
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const startDate = new Date(start + "T00:00:00");
  const maturity = addMonths(startDate, months);

  if (isNaN(startDate.getTime()) || startDate > maturity) return null;

  let count = 0;
  let grossInterest = 0;

  for (let i = 0; i < months; i++) {
    const depositDate = addMonths(startDate, i);
    if (depositDate > today || depositDate >= maturity) break;

    count++;
    const days = Math.max(
      0, Math.floor((today - depositDate) / 86400000)
    );
    grossInterest += monthly * (rate / 100) * days / 365;
  }

  let maturityInterest = 0;
  for (let i = 0; i < months; i++) {
    const depositDate = addMonths(startDate, i);
    const days = Math.max(
      0, Math.floor((maturity - depositDate) / 86400000)
    );
    maturityInterest += monthly * (rate / 100) * days / 365;
  }

  const principal = monthly * count;
  const currentNetInterest = grossInterest * (1 - tax / 100);
  const maturityNetInterest = maturityInterest * (1 - tax / 100);

  return {
    count,
    principal,
    currentInterest: currentNetInterest,
    currentTotal: principal + currentNetInterest,
    maturity,
    maturityPrincipal: monthly * months,
    maturityInterest: maturityNetInterest,
    maturityTotal: monthly * months + maturityNetInterest
  };
}

function updateSavingPreview() {
  const name = $("savingName").value.trim();
  const start = $("savingStart").value;
  const monthly = Number($("monthlyPayment").value);
  const months = Number($("savingMonths").value);
  const rate = Number($("annualRate").value);
  const tax = Number($("taxRate").value);

  if (!start || monthly <= 0 || months <= 0 ||
      rate < 0 || tax < 0 || tax > 100) {
    $("savingResult").textContent =
      "시작일, 월 납입액, 기간, 이율을 입력해 주세요.";
    return null;
  }

  const result = calculateSaving(start, monthly, months, rate, tax);
  if (!result) return null;

  $("savingResult").innerHTML = `
    <strong>${name || "적금"} 계산 결과</strong><br>
    현재 납입 횟수: ${result.count}회<br>
    현재 납입 원금: ${won(result.principal)}<br>
    현재 예상 세후 이자: ${won(result.currentInterest)}<br>
    <strong>현재 예상 잔액: ${won(result.currentTotal)}</strong><br>
    만기일: ${result.maturity.toLocaleDateString("ko-KR")}<br>
    만기 예상 원금: ${won(result.maturityPrincipal)}<br>
    만기 예상 세후 이자: ${won(result.maturityInterest)}<br>
    <strong>만기 예상 수령액: ${won(result.maturityTotal)}</strong>
  `;
  return result;
}

["savingName","savingStart","monthlyPayment",
 "savingMonths","annualRate","taxRate"].forEach(id => {
  $(id).addEventListener("input", updateSavingPreview);
});

$("savingForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const name = $("savingName").value.trim();
  const start = $("savingStart").value;
  const monthly = Number($("monthlyPayment").value);
  const months = Number($("savingMonths").value);
  const rate = Number($("annualRate").value);
  const tax = Number($("taxRate").value);

  const result = updateSavingPreview();

  if (!name || !result || monthly <= 0 || months <= 0) {
    alert("적금 정보를 올바르게 입력해 주세요.");
    return;
  }

  const existing = assets.find(item =>
    item.type === "예적금" && item.saving &&
    item.saving.name === name
  );

  const savingAsset = {
    id: existing ? existing.id :
      Date.now().toString() + Math.random().toString(16).slice(2),
    name,
    type: "예적금",
    amount: result.currentTotal,
    memo: "적금 자동 계산",
    saving: { name, start, monthly, months, rate, tax }
  };

  if (existing) {
    assets = assets.map(item =>
      item.id === existing.id ? savingAsset : item
    );
  } else {
    assets.push(savingAsset);
  }

  if (!saveAssets()) return;

  render();
  alert("적금이 자산 목록에 등록되었습니다.");
  $("savingForm").reset();
  $("taxRate").value = "15.4";
  $("savingResult").textContent =
    "적금 조건을 입력하면 예상 금액이 자동으로 계산됩니다.";
});

loadAssets();
render();
</script>
</body>
</html>
